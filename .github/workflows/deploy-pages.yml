# V11: Pages deploy requires CI + E2E success on the *same* SHA.
# workflow_run still listens to CI completion, then e2e-gate verifies E2E green
# for that SHA before build/deploy. Manual dispatch similarly requires both.
#
# DO NOT deploy a SHA whose E2E is red even if CI is green.
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve target SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Require successful CI on same SHA
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.sha.outputs.sha }}';
            const { owner, repo } = context.repo;
            const workflows = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', per_page: 50,
            });
            const hit = (workflows.data.workflow_runs || []).find(
              (r) => r.head_sha === sha && r.conclusion === 'success' && r.status === 'completed'
            );
            if (!hit) {
              core.setFailed(`Deploy blocked: no successful CI run for SHA ${sha}`);
            } else {
              core.info(`CI gate OK: run ${hit.id} for ${sha}`);
            }

  e2e-gate:
    needs: [ci-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful E2E on same SHA
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ needs.ci-gate.outputs.target_sha }}';
            const { owner, repo } = context.repo;
            // Prefer workflow file e2e.yml
            const workflows = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'e2e.yml', per_page: 50,
            });
            const hit = (workflows.data.workflow_runs || []).find(
              (r) => r.head_sha === sha && r.conclusion === 'success' && r.status === 'completed'
            );
            if (!hit) {
              core.setFailed(
                `Deploy blocked: no successful E2E run for SHA ${sha}. ` +
                `CI alone is insufficient (V11 same-SHA gate).`
              );
            } else {
              core.info(`E2E gate OK: run ${hit.id} for ${sha}`);
            }

  build:
    needs: [ci-gate, e2e-gate]
    if: >
      always() &&
      needs.ci-gate.result == 'success' &&
      needs.e2e-gate.result == 'success' && (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci-gate.outputs.target_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
