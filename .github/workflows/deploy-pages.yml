# V31-02: Pages deploy requires CI + E2E success on the *same* SHA, in EITHER completion order.
# Triggered by the completion of BOTH workflows (and manual dispatch). The early event finds the
# other workflow still running and exits cleanly with "waiting for <other>"; the late event sees
# both green and deploys. Failure / cancel of either → blocked (red, no deploy). A SHA that is no
# longer the tip of main is skipped ("stale") at the gate AND again right before deploying, and
# the deploy job is serialized (concurrency `pages`, no cancel) with a same-SHA duplicate check.
# Logic: scripts/deploy-gate.cjs (unit-tested with mocked REST: tests/v31-deploy-gate.test.ts).
#
# DO NOT deploy a SHA whose E2E is red even if CI is green.
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ['CI', 'E2E']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  deployments: read

# One gate per (SHA, triggering workflow): events never cancel each other across SHAs or orders.
concurrency:
  group: pages-gate-${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.event.workflow_run.name || 'dispatch' }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      target_sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Checkout gate script (default branch)
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Same-SHA CI + E2E gate (either order)
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const gate = require(`${process.env.GITHUB_WORKSPACE}/scripts/deploy-gate.cjs`)
            await gate.runGate({ github, context, core })

  build:
    needs: [gate]
    if: needs.gate.outputs.decision == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.target_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [gate, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    # serialized: an in-flight deploy is never cancelled; a queued one re-checks before deploying
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout gate script (default branch)
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Still tip of main and not yet deployed
        id: pre
        uses: actions/github-script@v7
        with:
          script: |
            const gate = require(`${process.env.GITHUB_WORKSPACE}/scripts/deploy-gate.cjs`)
            await gate.preDeploy({ github, context, core, sha: '${{ needs.gate.outputs.target_sha }}', manual: context.eventName === 'workflow_dispatch' })

      - name: Deploy to GitHub Pages
        if: steps.pre.outputs.go == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
