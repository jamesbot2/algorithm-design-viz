# Deploy only after CI succeeds on main (workflow_run), or manual dispatch
# that verifies CI green on the SAME SHA.
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Manual dispatch must prove CI already passed on this exact SHA.
  # (Documented alternative would be skipping this gate — we implement the check.)
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI on same SHA (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const { owner, repo } = context.repo;
            const workflows = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', per_page: 50,
            });
            const hit = (workflows.data.workflow_runs || []).find(
              (r) => r.head_sha === sha && r.conclusion === 'success' && r.status === 'completed'
            );
            if (!hit) {
              core.setFailed(
                `workflow_dispatch deploy blocked: no successful CI run for SHA ${sha}. ` +
                `Run CI on this commit first, then dispatch Pages.`
              );
            } else {
              core.info(`CI gate OK: run ${hit.id} succeeded for ${sha}`);
            }
      - name: workflow_run path
        if: github.event_name != 'workflow_dispatch'
        run: echo "CI already gated this workflow_run; ci-gate is a no-op success."

  build:
    needs: [ci-gate]
    if: >
      always() && (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push') ||
        (github.event_name == 'workflow_dispatch' && needs.ci-gate.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
