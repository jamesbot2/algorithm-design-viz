# V11: Pages deploy (deploy-pages.yml) now requires E2E success on the *same* SHA
# as CI before publish. Treat failures as hard release blockers.
# Prefer failing fast with evidence (traces under docs/traces/) for hidden-input timeouts.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: E2E
        run: npm run test:e2e
        env:
          CI: '1'
      - name: Upload traces & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-e2e-artifacts
          path: |
            docs/screenshots/v4/
            docs/traces/v4/
          if-no-files-found: ignore
